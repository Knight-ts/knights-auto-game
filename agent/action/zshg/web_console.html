<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaaGC 网页控制台</title>
<style>
  :root {
    --bg:#14171d; --panel:#1d222b; --panel2:#232a35; --line:#2e3746;
    --text:#e6ebf3; --muted:#9aa7b8; --accent:#4f8cff; --ok:#3ecf8e;
    --warn:#f0b429; --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Microsoft YaHei","Segoe UI",sans-serif}
  header{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:22px;
         padding:12px 22px;background:rgba(20,23,29,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  .brand{font-size:16px;font-weight:600;white-space:nowrap}
  .brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav button{background:none;border:1px solid transparent;color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:14px}
  nav button:hover{color:var(--text)}
  nav button.active{color:#fff;background:var(--panel2);border-color:var(--line)}
  main{padding:18px 22px 90px}
  .hidden{display:none !important}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:500}
  .big{font-size:18px;font-weight:600}
  .ok{color:var(--ok)} .bad{color:var(--err)} .warn{color:var(--warn)}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0}
  .kv span:first-child{color:var(--muted)}
  .mono{font-family:Consolas,monospace;font-size:12px;word-break:break-all}
  button.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;
             padding:7px 13px;cursor:pointer;font-size:13px}
  button.btn:hover{border-color:#46536a}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--err)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  pre{background:#12161c;border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;
      max-height:220px;overflow:auto;font-size:12px;color:#c7d1e0;white-space:pre-wrap}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500}
  .shot-wrap{background:#0b0e13;border:1px solid var(--line);border-radius:12px;padding:10px;
             display:flex;justify-content:center;align-items:center;min-height:320px}
  .shot-wrap img{max-width:100%;max-height:calc(100vh - 260px);border-radius:6px}
  .empty{color:var(--muted);text-align:center;padding:36px 0}
  .banner{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:920px;
          width:calc(100% - 40px);border-radius:10px;padding:10px 14px;background:var(--panel2);
          border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:13px;z-index:20}
  .banner.ok{border-color:#2f6b4f}.banner.err{border-color:#7a3434}
  .banner ul{margin:6px 0 0 18px;padding:0}
  /* 好娃提醒 */
  .alert-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  input[type=text],input[type=number],select,textarea{background:#12161c;color:var(--text);
      border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px;font-family:inherit}
  input[type=text]{min-width:150px}
  textarea{width:100%;min-height:54px;resize:vertical}
  .grow{flex:1 1 240px}
  .badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .badge.new{color:var(--warn);border-color:#5a4a1f}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .chip{background:#2a3342;border:1px solid #3a4557;border-radius:99px;padding:3px 6px 3px 10px;
        font-size:12px;display:flex;align-items:center;gap:6px}
  .chip button{background:none;border:none;color:var(--muted);padding:0 2px;font-size:14px;cursor:pointer}
  .chip button:hover{color:var(--err)}
  table.attrs td{padding:3px 6px 3px 0;border:none}
  table.attrs td:first-child{width:64px;color:var(--muted);font-size:12px}
  select.grade{width:74px} input.min{width:92px}
  .hint{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="brand">MaaGC 控制台<span id="clock"></span></div>
  <nav id="tabs">
    <button data-tab="home" class="active">主页</button>
    <button data-tab="control">总控台</button>
    <button data-tab="shot">截图</button>
    <button data-tab="alerts">好娃提醒</button>
  </nav>
</header>

<main>
  <!-- ==================== 主页 ==================== -->
  <section id="tab-home">
    <div class="grid">
      <div class="card">
        <h3>模拟器连接</h3>
        <div class="big" id="home-device">读取中…</div>
        <div class="kv"><span>序列号</span><span class="mono" id="home-serial">-</span></div>
        <div class="kv"><span>adb</span><span class="mono" id="home-adb">-</span></div>
        <div class="row" style="margin-top:10px">
          <button class="btn primary" onclick="connectDevice()">一键连接</button>
          <button class="btn" onclick="switchTab('control')">去总控台</button>
        </div>
      </div>
      <div class="card">
        <h3>MuMu 模拟器</h3>
        <div class="big" id="home-mumu">读取中…</div>
        <div class="kv"><span>ADB 端口</span><span id="home-mumu-port">-</span></div>
        <div class="kv"><span>状态</span><span id="home-mumu-state">-</span></div>
      </div>
      <div class="card">
        <h3>MaaGC</h3>
        <div class="big" id="home-maagc">读取中…</div>
        <div class="kv"><span>PID</span><span id="home-maagc-pid">-</span></div>
        <div class="kv"><span>提醒类型</span><span id="home-alerts">-</span></div>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <h3>最近日志</h3>
      <pre id="home-logs">读取中…</pre>
    </div>
  </section>

  <!-- ==================== 总控台 ==================== -->
  <section id="tab-control" class="hidden">
    <div class="card">
      <div class="row">
        <button class="btn primary" onclick="connectDevice()">连接设备</button>
        <button class="btn" onclick="disconnectDevice()">断开连接</button>
        <button class="btn danger" onclick="resetAdb()">重启 ADB 并重连</button>
        <button class="btn" onclick="loadOverview()">刷新状态</button>
        <span class="hint" id="control-hint"></span>
      </div>
      <div class="row" style="margin-top:12px">
        <span class="hint">常用按键：</span>
        <button class="btn" onclick="sendKey('BACK')">返回</button>
        <button class="btn" onclick="sendKey('HOME')">主页</button>
        <button class="btn" onclick="sendKey('APP_SWITCH')">最近任务</button>
        <button class="btn" onclick="sendKey('WAKEUP')">亮屏</button>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <h3>当前设备</h3>
      <table id="device-table"><thead><tr><th>序列号</th><th>状态</th><th>机型</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="card" style="margin-top:14px">
      <h3>操作结果</h3>
      <pre id="control-output">等待操作…</pre>
    </div>
  </section>

  <!-- ==================== 截图 ==================== -->
  <section id="tab-shot" class="hidden">
    <div class="card">
      <div class="row">
        <button class="btn primary" onclick="refreshShot()">刷新截图</button>
        <label class="row" style="gap:6px"><input type="checkbox" id="shot-auto" checked> 每 2 秒自动刷新</label>
        <a class="btn" id="shot-download" download="maa-shot.png" href="#">下载当前帧</a>
        <span class="hint" id="shot-hint"></span>
      </div>
    </div>
    <div class="shot-wrap" style="margin-top:14px">
      <img id="shot-img" alt="" style="display:none">
      <div id="shot-empty" class="empty">暂无画面，先到「总控台」连接设备</div>
    </div>
  </section>

  <!-- ==================== 好娃提醒 ==================== -->
  <section id="tab-alerts" class="hidden">
    <div class="card" style="margin-bottom:14px">
      <div class="row">
        <span class="hint">保存会写入条件表、检测节点和界面选项；“默认勾选”是类型自带的初始值。MaaGC 的实际勾选按实例保存，改完点「同步勾选到 MaaGC」并重启生效。</span>
        <span style="flex:1"></span>
        <button class="btn" onclick="loadAlerts()">重新读取</button>
        <button class="btn" onclick="addAlert()">＋ 新增类型</button>
        <button class="btn" onclick="syncSelection()">同步勾选到 MaaGC</button>
        <button class="btn primary" id="alert-save" onclick="saveAlerts()">保存并同步</button>
      </div>
    </div>
    <div id="alert-list"></div>
  </section>
</main>

<div id="banner" class="banner hidden"></div>
<datalist id="catalog"></datalist>

<script>
const ATTRS = ["力量", "体质", "技巧", "感知", "敏捷", "意志"];
const GRADES = ["", "E", "D", "C", "B", "A", "S", "SS"];
let consoleState = { conditions: [], catalog: [] };
let activeTab = "home";
let overviewTimer = null;
let shotTimer = null;

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? "" : v)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function banner(kind, lines) {
  const el = $("banner");
  el.className = "banner " + kind;
  el.innerHTML = lines.length > 1
    ? `<ul>${lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>`
    : esc(lines[0] || "");
  clearTimeout(banner.timer);
  banner.timer = setTimeout(() => el.classList.add("hidden"), 8000);
}

async function api(path, options) {
  const resp = await fetch(path, options);
  const type = resp.headers.get("Content-Type") || "";
  if (!type.includes("json")) throw new Error(await resp.text());
  return resp.json();
}

/* ---------------- 标签切换 ---------------- */
function switchTab(name) {
  activeTab = name;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
  ["home", "control", "shot", "alerts"].forEach((tab) => {
    $("tab-" + tab).classList.toggle("hidden", tab !== name);
  });
  clearInterval(overviewTimer);
  clearInterval(shotTimer);
  if (name === "home" || name === "control") {
    loadOverview();
    overviewTimer = setInterval(loadOverview, 3000);
  }
  if (name === "shot") {
    refreshShot();
    shotTimer = setInterval(() => {
      if ($("shot-auto").checked) refreshShot();
    }, 2000);
  }
  if (name === "alerts" && !consoleState.conditions.length) loadAlerts();
}

/* ---------------- 主页 / 总控台 ---------------- */
async function loadOverview() {
  try {
    const data = await api("/api/overview");
    $("clock").textContent = data.time ? " " + data.time : "";
    const deviceEl = $("home-device");
    if (data.connected) {
      deviceEl.textContent = "已连接";
      deviceEl.className = "big ok";
    } else {
      deviceEl.textContent = "未连接";
      deviceEl.className = "big bad";
    }
    $("home-serial").textContent = data.serial || "-";
    $("home-adb").textContent = data.adbPath || "-";

    const mumu = data.mumu || {};
    $("home-mumu").textContent = mumu.available ? (mumu.started ? "运行中" : "未启动") : "未安装";
    $("home-mumu").className = "big " + (mumu.started ? "ok" : "bad");
    $("home-mumu-port").textContent = mumu.port == null ? "-" : mumu.port;
    $("home-mumu-state").textContent = mumu.state || "-";

    $("home-maagc").textContent = data.maagc.running ? "运行中" : "未运行";
    $("home-maagc").className = "big " + (data.maagc.running ? "ok" : "bad");
    $("home-maagc-pid").textContent = data.maagc.pid || "-";
    $("home-alerts").textContent = data.alerts.count + " 个";

    $("home-logs").textContent = (data.logs || []).join("\n") || "暂时没有日志";
    renderDevices(data.devices || []);
  } catch (error) {
    $("home-logs").textContent = "读取状态失败：" + error.message;
  }
}

function renderDevices(devices) {
  const body = document.querySelector("#device-table tbody");
  body.innerHTML = devices.length
    ? devices.map((d) => `<tr><td class="mono">${esc(d.serial)}</td><td class="${d.state === "device" ? "ok" : "warn"}">${esc(d.state)}</td><td>${esc(d.model || "-")}</td></tr>`).join("")
    : '<tr><td colspan="3" class="empty">没有发现设备</td></tr>';
  $("control-hint").textContent = devices.length ? `共 ${devices.length} 台` : "没有发现设备";
}

async function postAndShow(path, payload, label) {
  try {
    const data = await api(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload || {}),
    });
    $("control-output").textContent = `[${label}]\n` + (data.output || JSON.stringify(data, null, 2));
    banner(data.ok ? "ok" : "err", [label + (data.ok ? "成功" : "失败")]);
    await loadOverview();
  } catch (error) {
    $("control-output").textContent = `[${label}] 失败：` + error.message;
    banner("err", [label + "失败：" + error.message]);
  }
}

const connectDevice = () => postAndShow("/api/device/connect", {}, "连接设备");
const disconnectDevice = () => postAndShow("/api/device/disconnect", {}, "断开连接");
const resetAdb = () => postAndShow("/api/device/reset", {}, "重启 ADB");
const sendKey = (key) => postAndShow("/api/device/key", { key }, "按键 " + key);

/* ---------------- 截图 ---------------- */
function refreshShot() {
  const img = $("shot-img");
  const empty = $("shot-empty");
  const stamp = Date.now();
  const probe = new Image();
  probe.onload = () => {
    img.src = probe.src;
    img.style.display = "";
    empty.style.display = "none";
    $("shot-hint").textContent = "更新于 " + new Date().toLocaleTimeString();
    $("shot-download").href = probe.src;
  };
  probe.onerror = () => {
    img.style.display = "none";
    empty.style.display = "";
    empty.textContent = "截图失败：设备未连接（先去总控台点「连接设备」）";
    $("shot-hint").textContent = "";
  };
  probe.src = "/api/screenshot?t=" + stamp;
}

/* ---------------- 好娃提醒 ---------------- */
function emptyAlert(index) {
  const seq = index + 1;
  const grades = {}, mins = {};
  ATTRS.forEach((a) => { grades[a] = ""; mins[a] = ""; });
  return {
    id: "type_" + seq, name: "新提醒类型", description: "",
    caseName: "新提醒类型 " + seq, node: "检测_新提醒类型" + seq,
    defaultChecked: false, features: [], grades, mins, orLines: [],
  };
}

const gradeOptions = (selected) =>
  GRADES.map((g) => `<option value="${g}" ${g === selected ? "selected" : ""}>${g || "—"}</option>`).join("");

function alertCard(condition, index) {
  const badges = [];
  if (!condition.nodeExists) badges.push('<span class="badge new">保存时创建检测节点</span>');
  if (!condition.caseExists) badges.push('<span class="badge new">保存时创建界面选项</span>');
  const chips = condition.features.map((f, fi) =>
    `<span class="chip">${esc(f)}<button title="移除" data-act="rm-feature" data-i="${index}" data-fi="${fi}">×</button></span>`).join("");
  const attrs = ATTRS.map((attr) => `
    <tr><td>${attr}</td>
      <td><select class="grade" data-i="${index}" data-attr="${attr}" data-f="grade">${gradeOptions(condition.grades[attr] || "")}</select></td>
      <td><input class="min" type="number" step="0.01" min="0" max="5" placeholder="不限"
           value="${esc(condition.mins[attr])}" data-i="${index}" data-attr="${attr}" data-f="min"></td></tr>`).join("");

  return `
  <div class="alert-card">
    <div class="row">
      <label class="field grow">界面显示名（勾选项名字）
        <input type="text" data-i="${index}" data-f="caseName" value="${esc(condition.caseName)}">
      </label>
      <label class="field">内部 ID
        <input class="mono" type="text" data-i="${index}" data-f="id" value="${esc(condition.id)}">
      </label>
      <label class="field">条件名
        <input type="text" data-i="${index}" data-f="name" value="${esc(condition.name)}">
      </label>
      <label class="row" style="margin-top:16px;gap:6px">
        <input type="checkbox" data-i="${index}" data-f="defaultChecked" ${condition.defaultChecked ? "checked" : ""}> 默认勾选
      </label>
      <button class="btn danger" data-act="remove" data-i="${index}" style="margin-top:16px">删除</button>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="field grow">说明
        <input type="text" data-i="${index}" data-f="description" value="${esc(condition.description)}">
      </label>
      <label class="field">检测节点
        <input class="mono" type="text" data-i="${index}" data-f="node" value="${esc(condition.node)}">
      </label>
      ${badges.join("")}
    </div>
    <div class="row" style="margin-top:10px;align-items:flex-start">
      <div class="grow">
        <div class="hint" style="margin-bottom:6px">必需特性（必须全部命中；留空表示不看特性）</div>
        <div class="chips">${chips}</div>
        <div class="row">
          <input type="text" list="catalog" placeholder="输入特性名，如 上古灵性"
                 data-i="${index}" data-role="feature-input" style="flex:1 1 200px">
          <button class="btn" data-act="add-feature" data-i="${index}">添加特性</button>
        </div>
      </div>
      <div style="flex:1 1 300px">
        <div class="hint" style="margin-bottom:6px">属性门槛（等级是“≥”语义）</div>
        <table class="attrs">${attrs}</table>
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="field" style="width:100%">或条件（每行一条，任一满足即可；格式 <code>敏捷&gt;=0.3</code>，同一行用“且”）
        <textarea data-i="${index}" data-f="orLines">${esc((condition.orLines || []).join("\n"))}</textarea>
      </label>
    </div>
  </div>`;
}

function renderAlerts() {
  $("alert-list").innerHTML = consoleState.conditions.length
    ? consoleState.conditions.map(alertCard).join("")
    : '<div class="empty">还没有提醒类型，点「＋ 新增类型」</div>';
}

async function loadAlerts() {
  try {
    consoleState = await api("/api/state");
    $("catalog").innerHTML = (consoleState.catalog || []).map((n) => `<option value="${esc(n)}"></option>`).join("");
    renderAlerts();
  } catch (error) {
    banner("err", ["读取提醒配置失败：" + error.message]);
  }
}

function addAlert() {
  consoleState.conditions.push(emptyAlert(consoleState.conditions.length));
  renderAlerts();
}

function updateAlertField(event) {
  const t = event.target;
  const index = Number(t.dataset.i);
  const field = t.dataset.f;
  if (!Number.isInteger(index) || !field || !consoleState.conditions[index]) return;
  const condition = consoleState.conditions[index];
  if (field === "grade") condition.grades[t.dataset.attr] = t.value;
  else if (field === "min") condition.mins[t.dataset.attr] = t.value;
  else if (field === "orLines") condition.orLines = t.value.split("\n").map((s) => s.trim()).filter(Boolean);
  else if (field === "defaultChecked") condition.defaultChecked = t.checked;
  else if (field === "caseName") {
    const oldName = condition.caseName;
    condition.caseName = t.value;
    if (condition.node === "检测_" + oldName) {
      condition.node = "检测_" + t.value;
      const input = document.querySelector(`input[data-f="node"][data-i="${index}"]`);
      if (input) input.value = condition.node;
    }
  } else condition[field] = t.value;
}

function addFeature(index) {
  const input = document.querySelector(`input[data-role="feature-input"][data-i="${index}"]`);
  const value = (input.value || "").trim();
  if (!value) return;
  const condition = consoleState.conditions[index];
  if (!condition.features.includes(value)) condition.features.push(value);
  input.value = "";
  renderAlerts();
}

async function saveAlerts() {
  const button = $("alert-save");
  button.disabled = true;
  try {
    const data = await api("/api/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conditions: consoleState.conditions }),
    });
    if (data.ok) {
      consoleState.conditions = data.conditions || consoleState.conditions;
      renderAlerts();
      banner("ok", ["保存成功：", ...(data.messages || [])]);
    } else {
      banner("err", ["保存失败：", ...(data.errors || ["未知错误"])]);
    }
  } catch (error) {
    banner("err", ["保存失败：" + error.message]);
  } finally {
    button.disabled = false;
  }
}

async function syncSelection() {
  const names = consoleState.conditions.filter((c) => c.defaultChecked).map((c) => c.caseName);
  try {
    const data = await api("/api/instance/sync", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ caseNames: names }),
    });
    banner(data.ok ? "ok" : "err", [data.message || "已同步实例勾选，重启 MaaGC 后生效"]);
  } catch (error) {
    banner("err", ["同步失败：" + error.message]);
  }
}

/* ---------------- 事件绑定 ---------------- */
$("tabs").addEventListener("click", (event) => {
  const target = event.target.closest("button[data-tab]");
  if (target) switchTab(target.dataset.tab);
});

$("alert-list").addEventListener("input", updateAlertField);
$("alert-list").addEventListener("change", updateAlertField);
$("alert-list").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && event.target.dataset.role === "feature-input") {
    event.preventDefault();
    addFeature(Number(event.target.dataset.i));
  }
});
$("alert-list").addEventListener("click", (event) => {
  const target = event.target.closest("button[data-act]");
  if (!target) return;
  const index = Number(target.dataset.i);
  if (target.dataset.act === "remove") {
    if (confirm("确定删除这个提醒类型？保存后会同时移除流水线节点和界面选项。")) {
      consoleState.conditions.splice(index, 1);
      renderAlerts();
    }
  } else if (target.dataset.act === "rm-feature") {
    consoleState.conditions[index].features.splice(Number(target.dataset.fi), 1);
    renderAlerts();
  } else if (target.dataset.act === "add-feature") {
    addFeature(index);
  }
});

switchTab("home");
</script>
</body>
